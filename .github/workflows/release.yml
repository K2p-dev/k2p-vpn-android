name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag_name:
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > app/release.jks
          else
            echo "Error: KEYSTORE_BASE64 is empty!"
            exit 1
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Artifact
        run: |
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "master" ] || [ "$TAG_NAME" = "main" ]; then
            VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1 | tr ' ' '-' | tr '[:upper:]' '[:lower:]')
            TAG_NAME="v${VER:-0.6.7-beta}"
          fi
          echo "RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"
          mkdir -p release_assets
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "release_assets/K2P-VPN-${TAG_NAME}.apk"
          else
            echo "Error: Release APK not found!"
            exit 1
          fi

      - name: Generate Release Notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges > release_notes.txt
          else
            git log -n 10 --pretty=format:"- %s" --no-merges > release_notes.txt
          fi
          if [ ! -s release_notes.txt ]; then
            echo "- Улучшение стабильности и исправление ошибок" > release_notes.txt
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release_assets/*.apk
          body_path: release_notes.txt
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}